<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>POS สแกนบาร์โค้ดบันทึกการขาย</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { background-color: #f8f9fa; font-family: 'Sarabun', sans-serif; }
    #reader { width: 100%; max-width: 400px; margin: 0 auto; display: none; }
  </style>
</head>
<body class="p-3 p-md-4">
  <div class="container-fluid">
    <h3 class="mb-3 text-primary">🛒 ระบบบันทึกการขาย (GitHub + Google Sheets)</h3>
    
    <div class="row g-3">
      <div class="col-lg-5">
        <div class="card shadow-sm p-3 mb-3">
          <h5>1. ยิงบาร์โค้ด / สแกนสินค้า</h5>
          <div class="input-group mb-3">
            <input type="text" id="barcodeInput" class="form-control form-control-lg" placeholder="ยิงบาร์โค้ดที่นี่ แล้วกด Enter" autofocus>
            <button class="btn btn-primary" type="button" onclick="handleManualBarcode()">ค้นหา</button>
          </div>
          <button class="btn btn-outline-success mb-2" onclick="toggleCameraScanner()">📷 เปิด/ปิด กล้องสแกน</button>
          <div id="reader"></div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card shadow-sm p-3">
          <h5>2. รายการสินค้าในตะกร้า</h5>
          <div class="table-responsive">
            <table class="table table-hover">
              <thead class="table-light">
                <tr>
                  <th>สินค้า</th>
                  <th width="120">ราคา</th>
                  <th width="100">จำนวน</th>
                  <th width="110">รวม</th>
                  <th width="60">ลบ</th>
                </tr>
              </thead>
              <tbody id="cartTableBody">
                <tr><td colspan="5" class="text-center text-muted">ยังไม่มีรายการสินค้าในตะกร้า</td></tr>
              </tbody>
            </table>
          </div>

          <hr>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>ยอดรวมทั้งหมด:</h4>
            <h2 class="text-danger fw-bold">฿<span id="totalAmount">0.00</span></h2>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <label class="form-label">ประเภทการรับเงิน</label>
              <select id="paymentMethod" class="form-select form-select-lg" onchange="toggleCashInput()">
                <option value="เงินสด">เงินสด</option>
                <option value="โอนเงิน">โอนเงิน / สแกน QR</option>
              </select>
            </div>
            <div class="col-md-6" id="cashGroup">
              <label class="form-label">รับเงินสดมา</label>
              <input type="number" id="cashReceived" class="form-control form-control-lg" placeholder="0.00" oninput="calculateChange()">
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3 text-secondary" id="changeGroup">
            <h5>เงินทอน:</h5>
            <h3 class="fw-bold text-success">฿<span id="changeAmount">0.00</span></h3>
          </div>

          <button class="btn btn-success btn-lg w-100 py-3 fw-bold" onclick="submitSale()">✅ บันทึกการขายและตัดสต็อก</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ นำ Web App URL ที่ได้จากการ Deploy ใน Google Apps Script มาวางตรงนี้
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzoMMr35XvUrzwbXpF8dpR625etc6uqxggYLAqm1SRWxOH2sscS_ISXZZp5h2kgPBEk/exec";

    let cart = [];
    let html5QrcodeScanner = null;
    let isScanning = false;

    document.getElementById('barcodeInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') handleManualBarcode();
    });

    function handleManualBarcode() {
      const barcode = document.getElementById('barcodeInput').value.trim();
      if (!barcode) return;
      fetchProduct(barcode);
      document.getElementById('barcodeInput').value = '';
    }

    // ดึงข้อมูลสินค้าด้วย Fetch API (GET)
    function fetchProduct(barcode) {
      Swal.showLoading();
      fetch(`${WEB_APP_URL}?action=getProduct&barcode=${encodeURIComponent(barcode)}`)
        .then(res => res.json())
        .then(res => {
          Swal.close();
          if (!res.success) {
            Swal.fire('ไม่พบสินค้า', res.message, 'warning');
            return;
          }
          addToCart(res.product);
        })
        .catch(err => {
          Swal.fire('Error', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
        });
    }

    function addToCart(product) {
      const existing = cart.find(item => String(item.productId) === String(product.productId));
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      renderCart();
    }

    function renderCart() {
      const tbody = document.getElementById('cartTableBody');
      if (cart.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">ยังไม่มีรายการสินค้าในตะกร้า</td></tr>';
        document.getElementById('totalAmount').innerText = '0.00';
        calculateChange();
        return;
      }

      let html = '';
      cart.forEach((item, index) => {
        const subtotal = item.price * item.qty;
        html += `
          <tr>
            <td><strong>${item.productName}</strong><br><small class="text-muted">${item.productId}</small></td>
            <td><input type="number" class="form-control form-control-sm text-end" value="${item.price}" step="any" oninput="updatePrice(${index}, this.value)"></td>
            <td><input type="number" class="form-control form-control-sm text-center" value="${item.qty}" min="1" onchange="updateQty(${index}, this.value)"></td>
            <td class="text-end fw-bold" id="subtotal-${index}">฿${subtotal.toFixed(2)}</td>
            <td class="text-center"><button class="btn btn-sm btn-outline-danger" onclick="removeItem(${index})">✕</button></td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
      calculateTotal();
    }

    function updatePrice(index, val) {
      const newPrice = parseFloat(val);
      if (!isNaN(newPrice) && newPrice >= 0) {
        cart[index].price = newPrice;
        const subtotal = cart[index].price * cart[index].qty;
        document.getElementById(`subtotal-${index}`).innerText = `฿${subtotal.toFixed(2)}`;
        calculateTotal();
      }
    }

    function updateQty(index, val) {
      cart[index].qty = parseInt(val) || 1;
      renderCart();
    }

    function removeItem(index) {
      cart.splice(index, 1);
      renderCart();
    }

    function calculateTotal() {
      let total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      document.getElementById('totalAmount').innerText = total.toFixed(2);
      calculateChange();
    }

    function calculateChange() {
      const total = parseFloat(document.getElementById('totalAmount').innerText) || 0;
      const cash = parseFloat(document.getElementById('cashReceived').value) || 0;
      const change = Math.max(0, cash - total);
      document.getElementById('changeAmount').innerText = change.toFixed(2);
    }

    function toggleCashInput() {
      const method = document.getElementById('paymentMethod').value;
      document.getElementById('cashGroup').style.display = method === 'เงินสด' ? 'block' : 'none';
      document.getElementById('changeGroup').style.display = method === 'เงินสด' ? 'flex' : 'none';
    }

    function toggleCameraScanner() {
      const reader = document.getElementById('reader');
      if (reader.style.display === 'none' || reader.style.display === '') {
        reader.style.display = 'block';
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 150 } });
        html5QrcodeScanner.render((decodedText) => {
          if (!isScanning) {
            isScanning = true;
            fetchProduct(decodedText);
            setTimeout(() => { isScanning = false; }, 2000);
          }
        });
      } else {
        reader.style.display = 'none';
        if (html5QrcodeScanner) html5QrcodeScanner.clear();
      }
    }

    // ส่งข้อมูลบันทึกการขายด้วย Fetch API (POST)
    function submitSale() {
      if (cart.length === 0) return Swal.fire('ตะกร้าว่างเปล่า', 'กรุณาสแกนสินค้าก่อน', 'warning');

      const total = parseFloat(document.getElementById('totalAmount').innerText) || 0;
      const method = document.getElementById('paymentMethod').value;
      const cash = parseFloat(document.getElementById('cashReceived').value) || 0;
      const change = parseFloat(document.getElementById('changeAmount').innerText) || 0;

      if (method === 'เงินสด' && cash < total) {
        return Swal.fire('จำนวนเงินไม่พอ', 'รับเงินมาน้อยกว่ายอดรวมสุทธิ', 'error');
      }

      const saleData = {
        totalItems: cart.reduce((sum, item) => sum + item.qty, 0),
        totalAmount: total,
        paymentMethod: method,
        cashReceived: cash,
        changeAmount: change,
        items: cart
      };

      Swal.showLoading();

      fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(saleData)
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          Swal.fire('บันทึกสำเร็จ!', `เลขที่ออเดอร์: ${res.orderId}`, 'success').then(() => {
            cart = [];
            document.getElementById('cashReceived').value = '';
            renderCart();
          });
        } else {
          Swal.fire('เกิดข้อผิดพลาด', res.message, 'error');
        }
      })
      .catch(err => {
        Swal.fire('Error', 'ไม่สามารถส่งข้อมูลได้: ' + err.toString(), 'error');
      });
    }
  </script>
</body>
</html>
